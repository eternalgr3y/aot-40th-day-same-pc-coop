# ============================================================================
# COOP - FORCE UNADDRESSED COd FRAMING (SAME-PC handshake-symmetry shim, 2026-06-11)
# *** EMULATION/SAME-PC SHIM, NOT THE NATIVE BEHAVIOR. ***
#
# The commudp handshake advances per-peer state conn+0x70 1->2 ONLY when the
# RECEIVED COd carries advance-byte payload[0x5a]!=0, and the COd builder
# 0x823a3ac8 sets payload[0x5a] = (conn+0x194 (rxProc) != 0) -- i.e. "I have
# already received+parsed YOUR COd." It's a 2-way ACK (like SYN/SYN-ACK): once
# each side can PARSE the other's COd, both rxProc->1, both emit payload[0x5a]=1,
# both advance. So the ONLY blocker is a FRAMING ASYMMETRY:
#   - The host (resolver) emits an ADDRESSED COd: flush 0x8239d620, when the
#     per-entry flag entry+0x680 != 0 (set by the secure-assoc resolve at
#     0x8239e7e4), prepends a +10 addressed header (00 67 marker + 6-byte connId
#     block + per-msg length) -> "COd" lands at payload offset 12.
#   - The joiner never resolves the host (stubbed XNet/matchmaking) so entry+0x680
#     stays 0 -> it emits UNADDRESSED "COd"@2.
# The receiver's recv worker 0x823a4500 + handler 0x823a3f48 parse "COd" at a
# FIXED offset 2 and the token at fixed 0x10. So the joiner CANNOT parse the host's
# addressed COd@12 -> drops it -> its rxProc stays 0 -> it never emits
# payload[0x5a]=1 -> the host never advances. Deadlock.
#
# FIX (force every commudp datagram UNADDRESSED for the session lifetime): patch
# the flush's framing-selector load so entry+0x680 always reads 0, taking the
# unaddressed branch (beq 0x8239d764). Output becomes byte-identical to the
# joiner's accepted 96-byte "COd"@2 frame (parser-verified) -> host COd now parses
# on the joiner -> joiner rxProc->1 -> joiner emits payload[0x5a]=1 -> host
# advances; host already has rxProc=1 so it emits payload[0x5a]=1 -> joiner
# advances. BOTH reach conn+0x70=2 (CONNECTED).
#   0x8239d6c0: lbz r11,0x680(r31) (89 7F 06 80)  ->  li r11,0 (39 60 00 00)
#
# Pairs with: --aot_register_peer (routing entry so the send hook matches) +
# the bind-:6000 .patch (so :6000 is really bound for delivery). Run on BOTH rigs.
#
# SCOPE/SAFETY (reviewed): the patch sits inside the commudp xport flush 0x8239d620
# only -- it changes payload framing of commudp datagrams, NOT the dest sockaddr
# (0x82321a90), NOT matchmaking/Blaze/NetGameLink :1000 traffic, NOT the resolve
# state machine. It IS a no-op on the joiner (entry+0x680 already 0). It forces ALL
# host commudp frames unaddressed (handshake + established) -- REQUIRED here since
# the joiner never resolves the host and always parses "COd"@2. Framing is set
# BEFORE the flush's RC4 encrypt, so it is the correct (plaintext) layer.
#
# *** DO NOT carry to real-XNet / netplay-fork targets, or to >2-peer sessions:
# unconditionally forcing unaddressed omits the connId demux header a genuinely-
# resolved peer needs. Same-PC 2-player only. Reversible: is_enabled=false. ***
# ============================================================================
[[patch]]
name = "Coop - force unaddressed COd framing (same-PC handshake shim)"
desc = "Force the commudp flush 0x8239d620 to always emit unaddressed COd (\"COd\"@2) by reading entry+0x680 as 0, so the joiner can parse the host's COd, both rxProc->1, both emit the advance-byte, and both reach CONNECTED. Same-PC handshake-symmetry shim; pairs with --aot_register_peer + bind-:6000."
author = "AoT same-PC co-op research project"
is_enabled = true

[[patch.be32]]
address = 0x8239d6c0
value = 0x39600000
